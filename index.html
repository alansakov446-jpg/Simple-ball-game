<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Шарики</title>
<style>
html,body{margin:0;height:100%;background:#141b33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,u,fx0,fy0,fx1,fy1,R,obs,bolt;
const red={x:0,y:0,vx:0,vy:0},blue={x:0,y:0,vx:0,vy:0};
let state='ready',t=0,best=0,ang=0,angT=0,nextTilt=4,warn=0,overAt=0;
let drag=null;
try{best=+localStorage.getItem('bb_best')||0}catch(e){}

function layout(){
  const dpr=window.devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  u=Math.min(W,H)/100;
  fx0=3*u;fx1=W-3*u;fy0=Math.max(14*u,40);fy1=H-3*u;
  R=4.6*u;
  obs={x:fx0+16*u,y:fy1-18*u,r:3.2*u};
  const bx=fx1-11*u;
  bolt={x1:bx,y1:fy0+14*u,x2:bx,y2:fy0+14*u+(fy1-fy0)*.5,r:1.6*u};
  if(state==='ready')reset();
}
function reset(){
  red.x=(fx0+fx1)/2;red.y=fy1-R*2;red.vx=red.vy=0;
  blue.x=fx0+R*2;blue.y=fy0+R*2;blue.vx=blue.vy=0;
  t=0;ang=angT=0;nextTilt=4;warn=0;drag=null;
}
addEventListener('resize',layout);layout();

function hit(b,px,py,pr,mode){
  const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy),m=R+pr;
  if(d>=m||d===0)return;
  const nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    if(mode==='stop'){b.vx=(b.vx-vn*nx)*.5;b.vy=(b.vy-vn*ny)*.5}
    else{b.vx-=2*vn*nx;b.vy-=2*vn*ny;b.vx+=nx*30*u;b.vy+=ny*30*u}
  }
}
function hitSeg(b,s,mode){
  const ex=s.x2-s.x1,ey=s.y2-s.y1;
  let k=((b.x-s.x1)*ex+(b.y-s.y1)*ey)/(ex*ex+ey*ey);
  k=Math.max(0,Math.min(1,k));
  hit(b,s.x1+ex*k,s.y1+ey*k,s.r,mode);
}
function walls(b){
  if(b.x<fx0+R){b.x=fx0+R;if(b.vx<0)b.vx*=-.7}
  if(b.x>fx1-R){b.x=fx1-R;if(b.vx>0)b.vx*=-.7}
  if(b.y<fy0+R){b.y=fy0+R;if(b.vy<0)b.vy*=-.7}
  if(b.y>fy1-R){b.y=fy1-R;if(b.vy>0)b.vy*=-.7}
}
function clampSpeed(b){
  const s=Math.hypot(b.vx,b.vy),m=230*u;
  if(s>m){b.vx*=m/s;b.vy*=m/s}
}

function step(dt,gx,gy){
  const g=120*u;
  for(const b of [red,blue]){b.vx+=gx*g*dt;b.vy+=gy*g*dt;const f=Math.exp(-.35*dt);b.vx*=f;b.vy*=f}
  // player control: drag vector -> acceleration
  if(drag){
    const k=260*u/70;
    red.vx+=drag.dx*k*dt;red.vy+=drag.dy*k*dt;
  }
  // blue AI
  const lvl=Math.min(1,t/60),A=(165+80*lvl)*u;
  const rx=blue.x-red.x,ry=blue.y-red.y;
  const px=-gy,py=gx;
  const h=-(rx*gx+ry*gy),l=rx*px+ry*py;
  let ax,ay;
  if(h>3*R){
    const bvl=blue.vx*px+blue.vy*py,rvl=red.vx*px+red.vy*py;
    let a=-(l*3+(bvl-rvl)*1.2);
    a=Math.max(-A*.6,Math.min(A*.6,a));
    ax=px*a;ay=py*a;
  }else{
    const wob=Math.sin(t*1.7)*R*(1-lvl*.7);
    const tx=red.x-gx*5*R+px*wob,ty=red.y-gy*5*R+py*wob;
    const dx=tx-blue.x,dy=ty-blue.y,d=Math.hypot(dx,dy)||1;
    ax=dx/d*A;ay=dy/d*A;
  }
  blue.vx+=ax*dt;blue.vy+=ay*dt;
  clampSpeed(red);clampSpeed(blue);

  const n=4,h2=dt/n;
  for(let i=0;i<n;i++){
    for(const b of [red,blue]){
      b.x+=b.vx*h2;b.y+=b.vy*h2;
      walls(b);
      hit(b,obs.x,obs.y,obs.r,'stop');
      hitSeg(b,bolt,'bounce');
      walls(b);
    }
    // ball vs ball
    const dx=blue.x-red.x,dy=blue.y-red.y,d=Math.hypot(dx,dy);
    if(d<2*R&&d>0){
      const nx=dx/d,ny=dy/d,o=(2*R-d)/2;
      red.x-=nx*o;red.y-=ny*o;blue.x+=nx*o;blue.y+=ny*o;
      const rvx=blue.vx-red.vx,rvy=blue.vy-red.vy;
      const vn=rvx*nx+rvy*ny;
      if(vn<0){
        const fall=rvx*gx+rvy*gy;      // blue speed toward red along gravity
        const above=-(nx*gx+ny*gy);    // 1 = blue is exactly on top
        if(above>.75&&fall>18*u){gameOver();return}
        const j=-(1+.8)*vn/2;
        red.vx-=j*nx;red.vy-=j*ny;blue.vx+=j*nx;blue.vy+=j*ny;
      }
    }
  }
}

function gameOver(){
  state='over';overAt=performance.now();
  if(t>best){best=t;try{localStorage.setItem('bb_best',String(best))}catch(e){}}
}

function pickTilt(){
  const opts=[0,-90,-60,-45,45,60,90].filter(a=>a!==angT);
  angT=opts[Math.floor(Math.random()*opts.length)];
  warn=0;nextTilt=t+5+Math.random()*4;
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){
    t+=dt;
    if(t>nextTilt-1&&warn===0)warn=1;
    if(t>nextTilt)pickTilt();
    ang+=(angT-ang)*Math.min(1,dt*3);
    const r=ang*Math.PI/180;
    step(dt,Math.sin(r),Math.cos(r));
  }
  draw();
  requestAnimationFrame(frame);
}

function ball(b,c1,c2){
  const g=ctx.createRadialGradient(b.x-R*.35,b.y-R*.4,R*.1,b.x,b.y,R);
  g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fill();
}
function text(s,x,y,size,color,w){
  ctx.font=(w||600)+' '+size+'px system-ui,-apple-system,sans-serif';
  ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(s,x,y);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#141b33';ctx.fillRect(0,0,W,H);
  // tray
  ctx.fillStyle='#8c8f8a';ctx.beginPath();ctx.roundRect(fx0-1.2*u,fy0-1.2*u,fx1-fx0+2.4*u,fy1-fy0+2.4*u,2*u);ctx.fill();
  ctx.fillStyle='#5f625f';ctx.beginPath();ctx.roundRect(fx0,fy0,fx1-fx0,fy1-fy0,1.2*u);ctx.fill();
  // bolt
  ctx.lineCap='round';
  ctx.strokeStyle='#3b2a24';ctx.lineWidth=bolt.r*2;
  ctx.beginPath();ctx.moveTo(bolt.x1,bolt.y1);ctx.lineTo(bolt.x2,bolt.y2);ctx.stroke();
  ctx.strokeStyle='#6b4a3c';ctx.lineWidth=bolt.r*.7;
  ctx.beginPath();ctx.moveTo(bolt.x1-bolt.r*.3,bolt.y1);ctx.lineTo(bolt.x2-bolt.r*.3,bolt.y2);ctx.stroke();
  // obstacle
  ctx.fillStyle='#0b0b0d';ctx.beginPath();ctx.arc(obs.x,obs.y,obs.r,0,7);ctx.fill();
  ctx.fillStyle='#2a2a30';ctx.beginPath();ctx.arc(obs.x-obs.r*.25,obs.y-obs.r*.25,obs.r*.4,0,7);ctx.fill();
  // balls
  ball(blue,'#6f9bff','#1d3fb8');
  ball(red,'#ff7a5c','#c4161c');
  // drag indicator
  if(drag){
    ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=.8*u;
    ctx.beginPath();ctx.moveTo(drag.x0,drag.y0);ctx.lineTo(drag.x0+drag.dx,drag.y0+drag.dy);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(drag.x0,drag.y0,1.6*u,0,7);ctx.fill();
  }
  // HUD
  const top=Math.max(8*u,24);
  text(t.toFixed(1)+' с',W/2,top,5.2*u,'#f2f2f7',700);
  text('рекорд '+best.toFixed(1),W/2,top+4.6*u,2.8*u,'#9aa3c2',500);
  // gravity arrow
  const r=ang*Math.PI/180,ax=W-9*u,ay=top-1*u;
  ctx.save();ctx.translate(ax,ay);
  ctx.strokeStyle=warn&&Math.abs(angT-ang)<1&&state==='play'?'#ffcc4d':'#f2f2f7';
  if(Math.abs(angT-ang)>1)ctx.strokeStyle='#ffcc4d';
  ctx.lineWidth=.9*u;ctx.beginPath();ctx.arc(0,0,4*u,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(r)*3*u,Math.cos(r)*3*u);ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(Math.sin(r)*3*u,Math.cos(r)*3*u,.9*u,0,7);ctx.fill();
  ctx.restore();
  if(state==='play'&&warn&&t>nextTilt-1)text('Наклон!',W/2,fy0+6*u,4*u,'#ffcc4d',700);
  // overlays
  if(state!=='play'){
    ctx.fillStyle='rgba(10,13,28,.72)';ctx.fillRect(fx0,fy0,fx1-fx0,fy1-fy0);
    const cx=W/2,cy=(fy0+fy1)/2;
    if(state==='ready'){
      text('Шарики',cx,cy-12*u,9*u,'#f2f2f7',800);
      text('Тяни пальцем — чем дальше, тем быстрее едет красный.',cx,cy-3*u,3.2*u,'#c9cfe6',500);
      text('Не дай синему упасть на красного сверху.',cx,cy+2*u,3.2*u,'#c9cfe6',500);
      text('Поле иногда наклоняется.',cx,cy+7*u,3.2*u,'#c9cfe6',500);
      text('Нажми, чтобы начать',cx,cy+17*u,4*u,'#ffcc4d',700);
    }else{
      text('Синий упал на красного',cx,cy-8*u,5.6*u,'#f2f2f7',800);
      text('Время: '+t.toFixed(1)+' с',cx,cy+1*u,4.4*u,'#c9cfe6',600);
      text('Рекорд: '+best.toFixed(1)+' с',cx,cy+7*u,3.6*u,'#9aa3c2',500);
      text('Нажми, чтобы сыграть ещё',cx,cy+17*u,4*u,'#ffcc4d',700);
    }
  }
}

// input
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  if(state==='ready'){reset();state='play';return}
  if(state==='over'){if(performance.now()-overAt>500){reset();state='play'}return}
  drag={x0:e.clientX,y0:e.clientY,dx:0,dy:0};
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  let dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  const d=Math.hypot(dx,dy);
  if(d>70){dx*=70/d;dy*=70/d}
  drag.dx=dx;drag.dy=dy;
});
const end=()=>{drag=null};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
requestAnimationFrame(frame);
</script>
</body>
</html>

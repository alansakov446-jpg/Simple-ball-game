<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Шарики 3D</title>
<style>
html,body{margin:0;height:100%;background:#141b33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f2f2f7}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;text-align:center;pointer-events:none;padding-top:10px}
#time{font-size:30px;font-weight:700}
#rec{font-size:13px;color:#9aa3c2}
#warn{font-size:20px;font-weight:700;color:#ffcc4d;height:26px}
.btn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);background:#232b4d;color:#f2f2f7;border:0;border-radius:12px;padding:10px 12px;font-size:15px}
#mute{right:10px}#view{left:10px}
#menu{position:fixed;inset:0;background:rgba(10,13,28,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#menu h1{margin:0;font-size:34px}
#menu p{margin:0;max-width:330px;color:#c9cfe6;font-size:15px;line-height:1.4}
.go{border:0;border-radius:14px;padding:14px 28px;font-size:18px;font-weight:700;color:#fff;width:260px}
#goR{background:#d12a2a}#goB{background:#2f5bd8}
#wait{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#141b33;font-size:16px;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="hud"><div id="time">0 сек</div><div id="rec"></div><div id="warn"></div></div>
<button class="btn" id="view">Вид: сзади</button>
<button class="btn" id="mute">Музыка: вкл</button>
<div id="menu">
  <h1 id="title">Шарики 3D</h1>
  <p id="sub">Тяни пальцем: вверх — вперёд, вбок — поворот. У каждого шарика есть зелёное пятно, оно медленно вращается. Если соперник коснётся твоего пятна, ты проиграл. Коснись его пятна первым.</p>
  <div id="rec2"></div>
  <button class="go" id="goR">Играть красным</button>
  <button class="go" id="goB">Играть синим</button>
</div>
<div id="wait">Не удалось загрузить 3D-движок. Проверь интернет и обнови страницу.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function load(src,ok,bad){const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
if(window.THREE)main();else load('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',main,()=>{document.getElementById('wait').style.display='flex'});

function main(){
const $=id=>document.getElementById(id);
const AR=20,R=1.2,G=30,A_PL=30;
// ---------- время ----------
const pl=(n,a,b,c)=>n%10===1&&n%100!==11?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c);
const fmt=s=>{s=Math.floor(s);const m=s/60|0,r=s%60;return (m?m+' '+pl(m,'минута','минуты','минут')+' ':'')+r+' сек'};
let best=0;try{best=+localStorage.getItem('bb3_best')||0}catch(e){}
const showRec=()=>{const s=best?'Лучшая победа: '+fmt(best):'Рекорда пока нет';$('rec').textContent=s;$('rec2').textContent=s};
showRec();
// ---------- музыка ----------
let ac,master,muted=false;
function note(f,d,v,type){const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.1);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.1)}
function music(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=ac.createGain();master.gain.value=muted?0:.25;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1500;
  const dl=ac.createDelay(1);dl.delayTime.value=.5;const fb=ac.createGain();fb.gain.value=.45;dl.connect(fb);fb.connect(dl);
  master.connect(lp);lp.connect(ac.destination);lp.connect(dl);dl.connect(ac.destination);
  const sc=[220,261.6,293.7,329.6,392,440,523.3,587.3];
  const ch=[[110,164.8,196],[87.3,130.8,174.6],[98,146.8,196],[110,164.8,261.6]];let ci=0;
  const pad=()=>{ch[ci++%4].forEach(f=>note(f,7.5,.12,'sine'))};pad();setInterval(pad,6000);
  setInterval(()=>{if(Math.random()<.65)note(sc[Math.floor(Math.random()*sc.length)],2.6,.14,'triangle')},700);
}
$('mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.25;$('mute').textContent='Музыка: '+(muted?'выкл':'вкл')};
// ---------- сцена ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141b33);scene.fog=new THREE.Fog(0x141b33,30,80);
const cam=new THREE.PerspectiveCamera(65,1,.1,200);
scene.add(new THREE.HemisphereLight(0xbfd0ff,0x202840,.95));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(8,20,6);scene.add(sun);
const cloth=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x1a2447}));cloth.rotation.x=-Math.PI/2;cloth.position.y=-6;scene.add(cloth);
const arena=new THREE.Group();scene.add(arena);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(AR,AR,.6,48),new THREE.MeshStandardMaterial({color:0x6a6d6a,roughness:.6,metalness:.3}));floor.position.y=-.3;arena.add(floor);
const rim=new THREE.Mesh(new THREE.TorusGeometry(AR,.5,8,64),new THREE.MeshStandardMaterial({color:0x9a9d98,metalness:.4,roughness:.5}));rim.rotation.x=Math.PI/2;rim.position.y=.1;arena.add(rim);
const obs=[{x:-8,z:6,r:1.6,m:'stop',c:0x0b0b0d,h:2},{x:9,z:-7,r:1.6,m:'stop',c:0x0b0b0d,h:2},{x:0,z:-2,r:.9,m:'bump',c:0x6b4a3c,h:3}];
obs.forEach(o=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(o.r,o.r,o.h,24),new THREE.MeshStandardMaterial({color:o.c,roughness:.5}));m.position.set(o.x,o.h/2,o.z);arena.add(m)});
function mkBall(col){
  const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(R,28,20),new THREE.MeshStandardMaterial({color:col,roughness:.35,metalness:.1})));
  const sp=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),new THREE.MeshStandardMaterial({color:0x22ff66,emissive:0x12c844,emissiveIntensity:.9}));
  g.add(sp);arena.add(g);return {x:0,z:0,vx:0,vz:0,sp:0,g,spot:sp};
}
const balls=[mkBall(0xe0302a),mkBall(0x2f5bd8)]; // 0 красный, 1 синий
// ---------- состояние ----------
let state='menu',pi=0,t=0,tvx=0,tvz=0,tgx=0,tgz=0,nextTilt=5,camYaw=0,viewMode=0,drag=null,overAt=0;
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
$('view').onclick=()=>{viewMode^=1;$('view').textContent='Вид: '+(viewMode?'сверху':'сзади')};
function start(role){
  music();pi=role;
  balls[0].x=-10;balls[0].z=6;balls[1].x=10;balls[1].z=-6;
  balls.forEach(b=>{b.vx=b.vz=0;b.sp=Math.random()*6});
  t=0;tvx=tvz=tgx=tgz=0;nextTilt=5;camYaw=role===0?Math.PI/2*1.0:-Math.PI/2*1.0;drag=null;
  camYaw=Math.atan2(balls[1-role].x-balls[role].x,-(balls[1-role].z-balls[role].z));
  state='play';$('menu').style.display='none';
}
$('goR').onclick=()=>start(0);$('goB').onclick=()=>start(1);
function finish(loser){
  const won=loser!==pi;state='over';overAt=performance.now();
  if(won&&(!best||t<best)){best=t;try{localStorage.setItem('bb3_best',String(best))}catch(e){}}
  showRec();
  $('title').textContent=won?'Победа!':'Проигрыш';
  $('sub').textContent=(won?'Ты коснулся зелёного пятна за ':'Тебя коснулись за ')+fmt(t)+'. Сыграем ещё?';
  setTimeout(()=>{$('menu').style.display='flex'},350);
}
// ---------- физика ----------
function hitObs(b,o){
  const dx=b.x-o.x,dz=b.z-o.z,d=Math.hypot(dx,dz),m=R+o.r;if(d>=m||!d)return;
  const nx=dx/d,nz=dz/d;b.x=o.x+nx*m;b.z=o.z+nz*m;const vn=b.vx*nx+b.vz*nz;
  if(vn<0){if(o.m==='stop'){b.vx=(b.vx-vn*nx)*.3;b.vz=(b.vz-vn*nz)*.3}else{b.vx-=2*vn*nx;b.vz-=2*vn*nz;b.vx+=nx*10;b.vz+=nz*10}}
}
function wall(b){
  const d=Math.hypot(b.x,b.z),m=AR-R;if(d<=m)return;
  const nx=b.x/d,nz=b.z/d;b.x=nx*m;b.z=nz*m;const vn=b.vx*nx+b.vz*nz;
  if(vn>0){b.vx-=1.5*vn*nx;b.vz-=1.5*vn*nz}
}
function step(dt){
  const lvl=Math.min(1,t/90);
  balls.forEach((b,i)=>{
    let ax=G*tvx,az=G*tvz;
    if(i===pi){
      if(drag){const jx=drag.dx/70,jy=drag.dy/70,s=Math.sin(camYaw),c=Math.cos(camYaw);
        ax+=(c*jx+s*(-jy))*A_PL;az+=(s*jx-c*(-jy))*A_PL}
    }else if(t>1.5){
      const o=balls[pi],f=o.sp+1.4*.4,tx=o.x+Math.cos(f)*R*2,tz=o.z+Math.sin(f)*R*2;
      const dx=tx-b.x,dz=tz-b.z,d=Math.hypot(dx,dz)||1,A=(17+9*lvl)+(Math.sin(t*1.3+i)*2);
      ax+=dx/d*A;az+=dz/d*A;
    }
    b.vx+=ax*dt;b.vz+=az*dt;const f=Math.exp(-1.1*dt);b.vx*=f;b.vz*=f;
    const s=Math.hypot(b.vx,b.vz);if(s>15){b.vx*=15/s;b.vz*=15/s}
    b.sp+=1.4*dt;
  });
  for(let k=0;k<3;k++){
    balls.forEach(b=>{b.x+=b.vx*dt/3;b.z+=b.vz*dt/3;wall(b);obs.forEach(o=>hitObs(b,o));wall(b)});
    const a=balls[0],b=balls[1],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<2*R&&d>0){
      const nx=dx/d,nz=dz/d,o=(2*R-d)/2;
      a.x-=nx*o;a.z-=nz*o;b.x+=nx*o;b.z+=nz*o;
      const da=nx*Math.cos(a.sp)+nz*Math.sin(a.sp),db=-(nx*Math.cos(b.sp)+nz*Math.sin(b.sp));
      if(da>.73||db>.73){finish(da>db?0:1);return}
      const vn=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;
      if(vn<0){const j=-1.7*vn/2;a.vx-=j*nx;a.vz-=j*nz;b.vx+=j*nx;b.vz+=j*nz}
    }
  }
}
// ---------- кадр ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'){
    t+=dt;
    if(t>nextTilt-1)$('warn').textContent='Наклон!';
    if(t>nextTilt){
      const mag=[0,.2,.35,.45][Math.floor(Math.random()*4)],ph=Math.random()*6.28;
      tgx=Math.cos(ph)*mag;tgz=Math.sin(ph)*mag;nextTilt=t+6+Math.random()*4;$('warn').textContent='';
    }
    tvx+=(tgx-tvx)*Math.min(1,dt*1.5);tvz+=(tgz-tvz)*Math.min(1,dt*1.5);
    step(dt);
    const p=balls[pi],s=Math.hypot(p.vx,p.vz);
    if(s>2){let d=Math.atan2(p.vx,-p.vz)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*Math.min(1,dt*2.5)}
    $('time').textContent=fmt(t);
  }
  arena.rotation.x=tvz;arena.rotation.z=-tvx;arena.updateMatrixWorld(true);
  balls.forEach(b=>{b.g.position.set(b.x,R,b.z);b.spot.position.set(Math.cos(b.sp)*R*.93,0,Math.sin(b.sp)*R*.93)});
  const p=balls[pi],fx=Math.sin(camYaw),fz=-Math.cos(camYaw);
  const D=viewMode?5:7,H=viewMode?15:4.2;
  cam.position.copy(arena.localToWorld(new THREE.Vector3(p.x-fx*D,H,p.z-fz*D)));
  cam.lookAt(arena.localToWorld(new THREE.Vector3(p.x+fx*3,0,p.z+fz*3)));
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
// ---------- ввод ----------
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;cv.setPointerCapture(e.pointerId);drag={x0:e.clientX,y0:e.clientY,dx:0,dy:0}});
cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;const d=Math.hypot(dx,dy);if(d>70){dx*=70/d;dy*=70/d}drag.dx=dx;drag.dy=dy});
const end=()=>{drag=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
requestAnimationFrame(frame);
}
</script>
</body>
</html>
